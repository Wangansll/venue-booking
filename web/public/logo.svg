<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <title>校园场馆</title>
  <defs>
    <linearGradient id="cv" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3b6ef5"/>
      <stop offset="1" stop-color="#7f5cff"/>
    </linearGradient>
  </defs>

  <!-- 主体：桁架屋顶构成的 C（开口朝右，像场馆的看台环） -->
  <path d="M49.7 14.3 A25 25 0 1 0 49.7 49.7"
        stroke="url(#cv)" stroke-width="8" stroke-linecap="round"/>

  <!-- 桁架：内圈三根斜撑，只在上/左/下半圈 -->
  <g stroke="url(#cv)" stroke-width="3.6" stroke-linecap="round">
    <line x1="18.2" y1="18.2" x2="23.4" y2="23.4"/>
    <line x1="12.0" y1="32.0" x2="19.4" y2="32.0"/>
    <line x1="18.2" y1="45.8" x2="23.4" y2="40.6"/>
  </g>

  <!-- 球场中线圆：点出「场馆」属性 -->
  <circle cx="32" cy="32" r="4.2" fill="url(#cv)"/>
</svg>
